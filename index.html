<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Threads Trend Radar</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">@</div>
        <div>
          <h1>Threads Trend Radar</h1>
          <p>每小時追蹤 Threads 熱門串文與成長速度</p>
        </div>
      </div>
      <div class="status-wrap">
        <span class="status-dot"></span>
        <span id="dataStatus">Demo 資料</span>
        <button id="refreshBtn" class="ghost-btn" type="button">重新整理</button>
      </div>
    </header>

    <main>
      <section class="hero-grid">
        <article class="hero-card featured">
          <div class="eyebrow">🔥 即時爆紅</div>
          <h2 id="heroTitle">正在載入…</h2>
          <div class="hero-meta" id="heroMeta"></div>
          <div class="hero-stats" id="heroStats"></div>
        </article>
        <article class="metric-card">
          <span>追蹤串文</span>
          <strong id="trackedCount">—</strong>
          <small>目前資料池</small>
        </article>
        <article class="metric-card">
          <span>本小時新進榜</span>
          <strong id="newEntryCount">—</strong>
          <small>Top 20 首次出現</small>
        </article>
        <article class="metric-card">
          <span>最後更新</span>
          <strong id="updatedAt">—</strong>
          <small>每小時更新一次</small>
        </article>
      </section>

      <section class="controls-card">
        <div class="control-group">
          <div class="control-label">時間</div>
          <div class="segmented" id="rangeTabs"></div>
        </div>
        <div class="control-group">
          <div class="control-label">排行榜</div>
          <div class="segmented" id="metricTabs"></div>
        </div>
        <div class="control-group filters-row">
          <label>
            <span>地區</span>
            <select id="regionFilter">
              <option value="all">全球</option>
              <option value="tw">台灣</option>
              <option value="us">美國</option>
              <option value="jp">日本</option>
              <option value="kr">韓國</option>
            </select>
          </label>
          <label>
            <span>主題</span>
            <select id="topicFilter">
              <option value="all">全部</option>
              <option value="tech">科技 / AI</option>
              <option value="finance">財經</option>
              <option value="sports">運動</option>
              <option value="ent">娛樂</option>
              <option value="life">生活</option>
            </select>
          </label>
          <label class="search-box">
            <span>搜尋</span>
            <input id="searchInput" placeholder="作者或貼文關鍵字" />
          </label>
        </div>
      </section>

      <section class="list-section">
        <div class="section-head">
          <div>
            <h2 id="rankingTitle">Top 20</h2>
            <p id="rankingSubtitle">依最近 1 小時熱門度排序</p>
          </div>
          <span class="demo-badge" id="demoBadge">DEMO MODE</span>
        </div>
        <div id="rankingList" class="ranking-list"></div>
        <div id="emptyState" class="empty-state" hidden>沒有符合條件的資料。</div>
      </section>
    </main>
  </div>

  <template id="postTemplate">
    <article class="post-card">
      <div class="rank"></div>
      <div class="post-main">
        <div class="post-head">
          <div class="author-row">
            <img class="avatar" alt="" />
            <div>
              <strong class="author"></strong>
              <span class="handle"></span>
            </div>
          </div>
          <div class="badges"></div>
        </div>
        <p class="post-text"></p>
        <div class="post-foot">
          <span class="posted-at"></span>
          <a class="open-link" target="_blank" rel="noopener noreferrer">開啟 Threads ↗</a>
        </div>
      </div>
      <div class="stats-grid">
        <div><span>👀 瀏覽</span><strong class="views"></strong><small class="viewsDelta"></small></div>
        <div><span>❤️ 按讚</span><strong class="likes"></strong><small class="likesDelta"></small></div>
        <div><span>💬 留言</span><strong class="replies"></strong><small class="repliesDelta"></small></div>
        <div><span>🔁 分享</span><strong class="shares"></strong><small class="sharesDelta"></small></div>
      </div>
      <div class="trend-box">
        <span>Trend Score</span>
        <strong class="trendScore"></strong>
        <small class="growth"></small>
      </div>
    </article>
  </template>

  <script src="assets/app.js" type="module"></script>
</body>
</html>
